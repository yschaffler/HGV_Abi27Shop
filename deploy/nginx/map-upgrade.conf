# Gehört nach /etc/nginx/conf.d/ – wird von der vHost-Konfiguration gebraucht.
#
# Setzt den Connection-Header passend zum Upgrade-Header. Ohne diese Zuordnung müsste
# man "Connection upgrade" hart setzen, was normale Anfragen stört.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
