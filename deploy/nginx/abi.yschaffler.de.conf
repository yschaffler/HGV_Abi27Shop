# Abi-Shop – nginx-vHost für abi.yschaffler.de
#
# Reihenfolge beim Einrichten (siehe docs/DEPLOYMENT.md):
#   1. abi.yschaffler.de.http-only.conf aktivieren
#   2. Zertifikat mit certbot holen
#   3. Diese Datei aktivieren und nginx neu laden
#
# Ablage: /etc/nginx/sites-available/abi.yschaffler.de.conf
# Aktivieren: ln -s ../sites-available/abi.yschaffler.de.conf /etc/nginx/sites-enabled/

# --- HTTP: nur Weiterleitung und ACME ---------------------------------------
# HINWEIS ZU IPv6: Die "listen [::]"-Zeilen setzen voraus, dass der Server IPv6 kann.
# Hat er keins, startet nginx mit
#   [emerg] socket() [::]:80 failed (97: Address family not supported by protocol)
# In dem Fall die beiden [::]-Zeilen entfernen.

server {
    listen 80;
    listen [::]:80;
    server_name abi.yschaffler.de;

    # Muss auch nach der Umstellung auf HTTPS erreichbar bleiben, sonst schlägt die
    # automatische Zertifikatserneuerung fehl.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    # Schreibweise bewusst so: "http2 on;" gibt es erst ab nginx 1.25.1, waehrend
    # Debian 12 noch 1.22 und Ubuntu 24.04 noch 1.24 ausliefert. Die Variante hier
    # funktioniert in allen Versionen.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abi.yschaffler.de;

    ssl_certificate     /etc/letsencrypt/live/abi.yschaffler.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abi.yschaffler.de/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/abi.yschaffler.de/chain.pem;

    # Von certbot mitgeliefert: aktuelle Cipher-Auswahl und DH-Parameter.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Kein ssl_stapling: Let's Encrypt hat seine OCSP-Responder abgeschaltet. Die
    # Direktive brächte hier nichts und würde nur bei jedem Reload eine Warnung ins
    # Fehlerlog schreiben.

    # Produktbilder sind auf 2 MB begrenzt; etwas Luft für den Formular-Overhead.
    # Ohne das quittiert nginx den Bild-Upload im Adminbereich mit 413.
    client_max_body_size 4m;

    # Exporte über viele Bestellungen dürfen etwas dauern.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/abi-shop.access.log;
    error_log  /var/log/nginx/abi-shop.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Host unverändert durchreichen. Das ist NICHT optional: Next.js vergleicht bei
        # Server Actions den Origin gegen Host bzw. X-Forwarded-Host, und die Anwendung
        # prüft das zusätzlich selbst. Ohne korrekten Host schlägt jede Bestellung und
        # jede Admin-Aktion mit einer Origin-Fehlermeldung fehl.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bewusst $remote_addr statt $proxy_add_x_forwarded_for:
        # Letzteres HÄNGT die echte IP an einen vom Client mitgeschickten Header AN.
        # Die Anwendung wertet für das Rate Limiting den ERSTEN Eintrag aus – ein
        # Angreifer könnte dort also eine beliebige IP hineinschreiben und sein Limit
        # umgehen. Ersetzen statt anhängen schließt das aus.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Sicherheits-Header (CSP mit Nonce, HSTS, nosniff ...) setzt die Anwendung selbst.
        # Hier bewusst nichts doppelt setzen: Zwei CSP-Header bedeuten, dass beide gelten,
        # und die Seite wäre kaputt, sobald sich die Anwendungs-CSP ändert.
    }
}
