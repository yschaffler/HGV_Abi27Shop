# Übergangskonfiguration NUR für die erstmalige Zertifikatsausstellung.
#
# nginx startet nicht, wenn eine Konfiguration auf ein Zertifikat verweist, das es noch
# nicht gibt – klassisches Henne-Ei-Problem. Deshalb zuerst diese Datei aktivieren,
# das Zertifikat holen und danach auf abi.yschaffler.de.conf umstellen.

# HINWEIS ZU IPv6: Die "listen [::]"-Zeilen setzen voraus, dass der Server IPv6 kann.
# Hat er keins, startet nginx mit
#   [emerg] socket() [::]:80 failed (97: Address family not supported by protocol)
# In dem Fall die beiden [::]-Zeilen entfernen.

server {
    listen 80;
    listen [::]:80;
    server_name abi.yschaffler.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
